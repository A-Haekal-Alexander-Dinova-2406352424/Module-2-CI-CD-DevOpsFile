<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Car</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .container { max-width: 480px; }
        label { display: block; margin-top: 1rem; }
        input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
        .error { color: #dc3545; margin-top: 0.25rem; font-size: 0.9rem; }
        .actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; }
        .btn { display: inline-block; padding: 0.5rem 0.75rem; text-decoration: none; border: 1px solid #0d6efd; background: #0d6efd; color: #fff; border-radius: 4px; }
        .btn.secondary { background: #fff; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create New Car</h1>
    <form th:action="@{/car/createCar}" th:object="${car}" method="post">
        <label for="carName">Name</label>
        <input id="carName" th:field="*{carName}" type="text" placeholder="Enter car name" required/>

        <label for="carColor">Color</label>
        <input id="carColor" th:field="*{carColor}" type="text" placeholder="Enter car color" required/>

        <label for="carQuantity">Quantity</label>
        <input id="carQuantity" th:field="*{carQuantity}" type="number" min="0" step="1" required/>
        <div class="error" th:if="${#fields.hasErrors('carQuantity')}" th:errors="*{carQuantity}"></div>

        <div class="actions">
            <button id="submitButton" class="btn" type="submit">Submit</button>
            <a id="backToListLink" class="btn secondary" th:href="@{/car/listCar}">Back</a>
        </div>
    </form>
</div>
</body>
</html>
