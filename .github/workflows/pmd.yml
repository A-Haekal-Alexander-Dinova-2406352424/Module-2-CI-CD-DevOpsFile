name: PMD Code Analysis

on:
  push:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run PMD
        uses: pmd/pmd-github-action@v2
        id: pmd
        with:
          version: "7.0.0-rc4"
          sourcePath: src/main/java
          rulesets: rulesets/java/quickstart.xml
          analyzeModifiedFilesOnly: false
      - name: Check code scanning availability
        id: code_scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?per_page=1" || echo "000")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code scanning not enabled (HTTP $status); skipping SARIF upload"
          fi
      - name: Upload SARIF file
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
      - name: Fail build if violations exist
        if: steps.pmd.outputs.violations != 0
        run: exit 1

