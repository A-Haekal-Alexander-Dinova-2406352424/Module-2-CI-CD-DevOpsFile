name: Deploy to Koyeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test

      - name: Skip deploy when Koyeb token is missing
        if: ${{ env.KOYEB_API_TOKEN == '' }}
        run: |
          echo "Skipping deploy: missing secret KOYEB_API_TOKEN"

      - name: Install and configure the Koyeb CLI
        if: ${{ env.KOYEB_API_TOKEN != '' }}
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ env.KOYEB_API_TOKEN }}

      - name: Deploy to Koyeb
        if: ${{ env.KOYEB_API_TOKEN != '' }}
        uses: koyeb/action-git-deploy@v1
        with:
          api_token: ${{ env.KOYEB_API_TOKEN }}
          app-name: module-2-ci-cd-devopsfile
          service-name: eshop
          git-builder: docker
          service-env: PORT=8080
          service-ports: "8080:http"
          service-routes: "/:8080"

