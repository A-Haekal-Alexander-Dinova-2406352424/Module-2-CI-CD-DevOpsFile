<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Car List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; max-width: 900px; }
        th, td { border: 1px solid #ddd; padding: 0.6rem; text-align: left; }
        th { background: #f5f5f5; }
        .actions { display: flex; gap: 0.5rem; }
        .btn { display: inline-block; padding: 0.35rem 0.6rem; text-decoration: none; border: 1px solid #0d6efd; background: #0d6efd; color: #fff; border-radius: 4px; cursor: pointer; }
        .btn.secondary { background: #fff; color: #0d6efd; }
        .btn.danger { border-color: #dc3545; background: #dc3545; }
        .toolbar { margin-bottom: 1rem; }
    </style>
</head>
<body>
<h1>Car List</h1>

<div class="toolbar">
    <a class="btn" th:href="@{/car/createCar}">Create Car</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Color</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
        <td th:text="${car.carId}"></td>
        <td th:text="${car.carName}"></td>
        <td th:text="${car.carColor}"></td>
        <td th:text="${car.carQuantity}"></td>
        <td>
            <div class="actions">
                <a class="btn secondary" th:href="@{/car/editCar/{id}(id=${car.carId})}">Edit</a>
                <form th:action="@{/car/deleteCar/{id}(id=${car.carId})}" method="post">
                    <button class="btn danger" type="submit">Delete</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
